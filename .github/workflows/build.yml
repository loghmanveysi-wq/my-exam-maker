name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD are missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Create Android project
        run: |
          flutter create . --platforms=android --project-name ozmoon_besaz
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="آزمون بساز"/' android/app/src/main/AndroidManifest.xml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set app icon
        run: |
          if [ -f assets/icon.png ]; then
            pip install pillow
            python3 - assets/icon.png android/app/src/main/res <<'PY'
          import sys, os
          from PIL import Image, ImageChops, ImageDraw
          im = Image.open(sys.argv[1]).convert('RGB')
          bg = Image.new('RGB', im.size, (255, 255, 255))
          diff = ImageChops.difference(im, bg).convert('L').point(lambda v: 255 if v > 24 else 0)
          l, t, r, b = diff.getbbox() or (0, 0, im.width, im.height)
          side = max(r - l, b - t)
          cx, cy = (l + r) // 2, (t + b) // 2
          im = im.crop((cx - side // 2, cy - side // 2, cx - side // 2 + side, cy - side // 2 + side))
          S = 4
          mask = Image.new('L', (side * S, side * S), 0)
          ImageDraw.Draw(mask).ellipse((0, 0, side * S - 1, side * S - 1), fill=255)
          out = im.convert('RGBA')
          out.putalpha(mask.resize((side, side), Image.LANCZOS))
          for k, v in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              d = os.path.join(sys.argv[2], 'mipmap-' + k)
              os.makedirs(d, exist_ok=True)
              out.resize((v, v), Image.LANCZOS).save(os.path.join(d, 'ic_launcher.png'))
          print('icons written')
          PY
          else
            echo "::warning::assets/icon.png not found, default icon used"
          fi

      - name: Add Bazaar billing
        run: |
          git clone --depth 1 https://github.com/4itsam/flutter_poolakey_plus.git packages/poolakey
          echo "plugin commit: $(git -C packages/poolakey rev-parse HEAD)"
          NAME=$(grep -m1 '^name:' packages/poolakey/pubspec.yaml | sed 's/^name:[[:space:]]*//' | tr -d '\r ')
          FILE=$(grep -rl "class FlutterPoolakey" packages/poolakey/lib | head -1)
          echo "plugin package name: $NAME, file: $FILE"
          if [ -z "$NAME" ] || [ -z "$FILE" ]; then
            echo "plugin layout not recognized"
            exit 1
          fi
          REL=${FILE#packages/poolakey/lib/}
          flutter pub add "$NAME" --path packages/poolakey
          sed -i "s#package:flutter_poolakey/flutter_poolakey.dart#package:$NAME/$REL#" lib/main.dart
          grep -n "poolakey" lib/main.dart | head -3
          python3 - <<'PY'
          p = 'android/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          if 'jitpack.io' not in s:
              assert 'mavenCentral()' in s, 'mavenCentral not found'
              s = s.replace('mavenCentral()', 'mavenCentral()\n        maven { url = uri("https://jitpack.io") }', 1)
              open(p, 'w', encoding='utf-8').write(s)
          m = 'android/app/src/main/AndroidManifest.xml'
          t = open(m, encoding='utf-8').read()
          if 'PAY_THROUGH_BAZAAR' not in t:
              perm = '<uses-permission android:name="com.farsitel.bazaar.permission.PAY_THROUGH_BAZAAR" />\n    '
              assert '<application' in t, 'application tag not found'
              t = t.replace('<application', perm + '<application', 1)
          pkg = '<package android:name="com.farsitel.bazaar" />'
          if pkg not in t:
              if '<queries>' in t:
                  t = t.replace('<queries>', '<queries>\n        ' + pkg, 1)
              else:
                  t = t.replace('</manifest>', '    <queries>\n        ' + pkg + '\n    </queries>\n</manifest>', 1)
          open(m, 'w', encoding='utf-8').write(t)
          print('billing ready')
          PY

      - name: Use release signing key
        run: |
          python3 - <<'PY'
          p = 'android/app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          block = '''    signingConfigs {
              create("release") {
                  storeFile = file(System.getenv("KEYSTORE_PATH"))
                  storePassword = System.getenv("KEYSTORE_PASSWORD")
                  keyAlias = "azmoon"
                  keyPassword = System.getenv("KEYSTORE_PASSWORD")
              }
          }

          buildTypes {'''
          assert 'buildTypes {' in s, 'buildTypes not found'
          s = s.replace('buildTypes {', block, 1)
          old = 'signingConfig = signingConfigs.getByName("debug")'
          assert old in s, 'debug signing line not found'
          s = s.replace(old, 'signingConfig = signingConfigs.getByName("release")')
          open(p, 'w', encoding='utf-8').write(s)
          print('patched')
          PY

      - name: Download Persian font
        run: |
          mkdir -p assets/fonts
          curl -L -o assets/fonts/Vazir.ttf https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Regular.ttf

      - run: flutter pub get

      - name: Build APK (retry on network errors)
        run: |
          for i in 1 2 3 4 5 6; do
            flutter build apk --release --build-number=${{ github.run_number }} && exit 0
            echo "Build failed (attempt $i), retrying in 90s..."
            sleep 90
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: azmoon-besaz-apk
          path: build/app/outputs/flutter-apk/app-release.apk
